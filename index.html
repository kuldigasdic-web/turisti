<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuldīgas Novada Maršruti</title>
  
  <!-- Fonts: Inter (vadlīnijās noteiktā alternatīva ikdienas un digitālajai videi) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet karte -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      /* Kuldīgas novada zīmola grāmatas krāsas */
      --primary: #3F4D33;         /* Meža Zaļš */
      --primary-hover: #2d3824;
      --bg: #EEEEE6;              /* Muižas Balts */
      --card-bg: #FFFFFF;
      --text: #212621;             /* Nakts Melns */
      --muted: #5e665e;
      --border: #D3CBBE;           /* Sudrabs */
      --accent: #E2C438;           /* Suitu Dzeltens */
      --tag-bg: #AEB8D4;           /* Miglas Zils */
      --radius: 8px;               /* Tīras, minimālas līnijas */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 4rem;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.9rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: var(--text);
    }

    .brand svg {
      height: 38px;
      width: auto;
      fill: var(--primary);
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .lang-switcher button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .lang-switcher button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }

    /* Filtri */
    .filters {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.45rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Režģis */
    .routes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .route-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .route-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(33, 38, 33, 0.06);
    }

    .card-img {
      height: 200px;
      width: 100%;
      object-fit: cover;
      background: #dfded7;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .tag {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--tag-bg);
      color: var(--text);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .route-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--text);
    }

    .route-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .route-desc {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: auto;
    }

    /* Modālais logs */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(33, 38, 33, 0.6);
      z-index: 100;
      overflow-y: auto;
      padding: 1.25rem;
    }

    .modal.open {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 760px;
      border-radius: var(--radius);
      margin: 2rem 0;
      overflow: hidden;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      z-index: 10;
    }

    #map {
      height: 340px;
      width: 100%;
      background: #dfded7;
    }

    .modal-body {
      padding: 1.75rem;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin: 1.5rem 0 0 0;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.35rem;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #e4e3da;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <!-- Oficiālais Kuldīgas novada K/vimbas simbols kā precīzs SVG vektors -->
        <svg viewBox="0 0 100 100" aria-label="Kuldīgas novads">
          <path d="M12 12 H42 V22 H32 V78 H42 V88 H12 V78 H22 V22 H12 Z"/>
          <path d="M42 50 C42 50 60 30 76 22 H92 V30 C76 42 66 50 66 50 C66 50 76 58 92 70 V78 H76 C60 70 42 50 42 50 Z"/>
          <ellipse cx="58" cy="50" rx="14" ry="7" fill="var(--card-bg)"/>
        </svg>
        <div class="brand-meta">
          <span class="brand-title">Kuldīgas Novads</span>
          <span class="brand-sub" id="header-subtitle">Tūrisma maršruti</span>
        </div>
      </a>
      <div class="lang-switcher">
        <button id="btn-lv" class="active" onclick="setLanguage('lv')">LV</button>
        <button id="btn-en" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <main>
    <div class="filters" id="filters-container"></div>
    <div class="routes-grid" id="routes-container"></div>
  </main>

  <div class="modal" id="route-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <div id="map"></div>
      <div class="modal-body" id="modal-details"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const uiTexts = {
      lv: {
        subtitle: "Tūrisma maršruti",
        all: "Visi maršruti",
        walking: "Kājāmgājējiem",
        cycling: "Velobraucējiem",
        heritage: "Kultūrvēsture",
        startRoute: "Doties maršrutā (Google Maps)",
        downloadGpx: "Lejupielādēt GPX",
        distance: "Garums",
        duration: "Aptuvenais laiks",
        surface: "Segums"
      },
      en: {
        subtitle: "Tourism Trails & Routes",
        all: "All trails",
        walking: "Walking & Hiking",
        cycling: "Cycling",
        heritage: "Heritage",
        startRoute: "Navigate (Google Maps)",
        downloadGpx: "Download GPX",
        distance: "Distance",
        duration: "Estimated time",
        surface: "Trail surface"
      }
    };

    // Reāli Kuldīgas novada maršrutu dati
    const routesData = [
      {
        id: "kuldiga-oldtown",
        type: "walking",
        distance: "3.2 km",
        duration: "1.0 h",
        surface_lv: "Bruģis, grants, koka laipas",
        surface_en: "Cobblestone, gravel, boardwalk",
        image: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=800&q=80",
        title_lv: "Ventas rumba un vēsturiskā vecpilsēta",
        title_en: "Venta Rapid & UNESCO Historic Old Town",
        desc_lv: "UNESCO Pasaules mantojuma pērle — Alekšupītes ūdenskritums, senais ķieģeļu tilts un pastaiga gar Ventas krastu.",
        desc_en: "A stroll through UNESCO heritage — Europe's widest waterfall, historic brick bridge, and preserved 17th-18th century architecture.",
        coordinates: [
          [56.9688, 21.9772],
          [56.9697, 21.9785],
          [56.9675, 21.9730],
          [56.9658, 21.9680]
        ],
        gpxUrl: "#"
      },
      {
        id: "renda-maras-kambari",
        type: "walking",
        distance: "5.5 km",
        duration: "1.5 h",
        surface_lv: "Meža un upes ielejas takas",
        surface_en: "Forest paths, river valley",
        image: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80",
        title_lv: "Māras kambari un Abavas senleja",
        title_en: "Māra's Chambers & Abava Valley",
        desc_lv: "Taka Rendas pagastā uz smilšakmens alām Abavas labajā krastā caur neskartu Kurzemes dabu.",
        desc_en: "A scenic forest trail in Renda leading to naturally sculpted sandstone caves along the Abava river valley.",
        coordinates: [
          [57.0792, 22.3421],
          [57.0820, 22.3460],
          [57.0865, 22.3510]
        ],
        gpxUrl: "#"
      },
      {
        id: "alsunga-suiti",
        type: "heritage",
        distance: "12.0 km",
        duration: "2.5 h",
        surface_lv: "Asfalts, lauku ceļi",
        surface_en: "Paved, rural gravel",
        image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&q=80",
        title_lv: "Suitu kultūrtelpas loks Alsungā",
        title_en: "Suiti Cultural Heritage Circuit",
        desc_lv: "Iepazīsti unikālo UNESCO Suitu novadu: Alsungas viduslaiku pili, Dižgabalkalnu un vietējās tradīcijas.",
        desc_en: "Explore the living UNESCO Suiti culture, the 14th-century Alsunga castle, ancient hillfort, and local crafts.",
        coordinates: [
          [56.9818, 21.5670],
          [56.9840, 21.5720],
          [56.9750, 21.5800],
          [56.9818, 21.5670]
        ],
        gpxUrl: "#"
      }
    ];

    let currentLang = 'lv';
    let currentFilter = 'all';
    let mapInstance = null;
    let routeLineLayer = null;

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-lv').classList.toggle('active', lang === 'lv');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('header-subtitle').textContent = uiTexts[lang].subtitle;
      renderFilters();
      renderRoutes();
    }

    function renderFilters() {
      const container = document.getElementById('filters-container');
      const types = ['all', 'walking', 'cycling', 'heritage'];
      container.innerHTML = types.map(type => `
        <button class="filter-btn ${currentFilter === type ? 'active' : ''}" 
                onclick="setFilter('${type}')">
          ${uiTexts[currentLang][type]}
        </button>
      `).join('');
    }

    function setFilter(type) {
      currentFilter = type;
      renderFilters();
      renderRoutes();
    }

    function renderRoutes() {
      const container = document.getElementById('routes-container');
      const filtered = routesData.filter(r => currentFilter === 'all' || r.type === currentFilter);

      container.innerHTML = filtered.map(r => `
        <div class="route-card" onclick="openRoute('${r.id}')">
          <img class="card-img" src="${r.image}" alt="${r['title_' + currentLang]}">
          <div class="card-body">
            <div class="tags">
              <span class="tag">${uiTexts[currentLang][r.type]}</span>
            </div>
            <h3 class="route-title">${r['title_' + currentLang]}</h3>
            <div class="route-meta">
              <span>📏 ${r.distance}</span>
              <span>⏱ ${r.duration}</span>
            </div>
            <p class="route-desc">${r['desc_' + currentLang]}</p>
          </div>
        </div>
      `).join('');
    }

    function openRoute(id) {
      const route = routesData.find(r => r.id === id);
      if (!route) return;

      const modal = document.getElementById('route-modal');
      const details = document.getElementById('modal-details');
      const startCoord = route.coordinates[0];
      const gmapsLink = `https://www.google.com/maps/dir/?api=1&destination=${startCoord[0]},${startCoord[1]}`;

      details.innerHTML = `
        <h2 style="font-weight:700; color:var(--text); margin-bottom: 0.5rem;">${route['title_' + currentLang]}</h2>
        <div class="route-meta">
          <span>📏 ${uiTexts[currentLang].distance}: ${route.distance}</span>
          <span>⏱ ${uiTexts[currentLang].duration}: ${route.duration}</span>
          <span>🛣 ${uiTexts[currentLang].surface}: ${route['surface_' + currentLang]}</span>
        </div>
        <p style="margin: 1.25rem 0; color: var(--muted);">${route['desc_' + currentLang]}</p>
        <div class="actions">
          <a href="${gmapsLink}" target="_blank" class="btn btn-primary">
            ${uiTexts[currentLang].startRoute}
          </a>
          <a href="${route.gpxUrl}" class="btn btn-secondary">
            ${uiTexts[currentLang].downloadGpx}
          </a>
        </div>
      `;

      modal.classList.add('open');

      setTimeout(() => {
        if (!mapInstance) {
          mapInstance = L.map('map');
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
          }).addTo(mapInstance);
        }

        if (routeLineLayer) {
          mapInstance.removeLayer(routeLineLayer);
        }

        routeLineLayer = L.polyline(route.coordinates, {
          color: '#3F4D33',
          weight: 5
        }).addTo(mapInstance);

        L.marker(startCoord).addTo(mapInstance);
        mapInstance.fitBounds(routeLineLayer.getBounds(), { padding: [40, 40] });
      }, 100);
    }

    function closeModal() {
      document.getElementById('route-modal').classList.remove('open');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'route-modal') closeModal();
    }

    setLanguage('lv');
  </script>
</body>
</html>
